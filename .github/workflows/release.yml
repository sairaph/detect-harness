name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wrappers/node/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup toolchain install stable --profile minimal
      - run: go test ./...
      - run: go vet ./...
      - run: npm ci --prefix wrappers/node
      - run: npm test --prefix wrappers/node
      - run: PYTHONPATH=wrappers/python/src python -m unittest discover -s wrappers/python/tests -v
      - run: cargo test --manifest-path wrappers/rust/Cargo.toml
      - run: go install github.com/goreleaser/goreleaser/v2@v2.12.0
      - run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
