name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - run: go test ./...
      - run: go vet ./...

  node:
    strategy:
      matrix:
        node: [18, 20, 22]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wrappers/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: wrappers/node/package-lock.json
      - run: npm ci
      - run: npm test

  python:
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wrappers/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v

  rust:
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.71.0", stable]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wrappers/rust
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - run: rustup default ${{ matrix.rust }}
      - run: rustup component add rustfmt
      - run: cargo fmt --check
      - run: cargo test

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - run: GOOS=linux GOARCH=amd64 go build ./cmd/detect-harness
      - run: GOOS=linux GOARCH=arm64 go build ./cmd/detect-harness
      - run: GOOS=darwin GOARCH=amd64 go build ./cmd/detect-harness
      - run: GOOS=darwin GOARCH=arm64 go build ./cmd/detect-harness
      - run: GOOS=windows GOARCH=amd64 go build ./cmd/detect-harness
      - run: GOOS=windows GOARCH=arm64 go build ./cmd/detect-harness
