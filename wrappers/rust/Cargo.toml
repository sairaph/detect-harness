[package]
name = "detect-harness"
version = "0.1.0"
edition = "2021"
rust-version = "1.71"
description = "Thin Rust wrapper for the detect-harness companion binary"
license = "MIT"
authors = ["Łael Al-Halawani <laelhalawani@gmail.com>"]
repository = "https://github.com/sairaph/detect-harness"
readme = "README.md"
keywords = ["mcp", "configuration", "cli"]
categories = ["api-bindings", "config"]
include = ["src/**", "tests/**", "Cargo.toml", "README.md", "LICENSE"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
